<!DOCTYPE html>
<html>

<head>
	<title>Piccap restart</title>
</head>

<script src="webOSTVjs-1.2.4/webOSTV.js" charset="utf-8"></script>
<script src="webOSTVjs-1.2.4/webOSTV-dev.js" charset="utf-8"></script>
<body>
<script type="text/javascript">
(function () {
	var SERVICE_URL = "luna://org.webosbrew.piccap.service";
	var DUPLICATE_LAUNCH_WINDOW_MS = 2000;
	var lastToggleStartedAt = 0;
	var toggleInProgress = false;

	function log(value) {
		try {
			console.log(JSON.stringify(value));
		} catch (err) {
			console.log(value);
		}
	}

	function request(method, onSuccess, onFailure) {
		webOS.service.request(SERVICE_URL, {
			method: method,
			parameters: {},
			onSuccess: onSuccess,
			onFailure: onFailure
		});
	}

	function togglePiccap(source) {
		var now = Date.now();

		if (toggleInProgress || now - lastToggleStartedAt < DUPLICATE_LAUNCH_WINDOW_MS) {
			log({ message: "Ignoring duplicate launch", source: source });
			return;
		}

		lastToggleStartedAt = now;
		toggleInProgress = true;

		request("status", function (status) {
			var nextMethod = status && status.isRunning === true ? "stop" : "start";

			log({ source: source, status: status, action: nextMethod });

			request(nextMethod, function (res) {
				toggleInProgress = false;
				log(res);
			}, function (res) {
				toggleInProgress = false;
				log(res);
			});
		}, function (res) {
			toggleInProgress = false;
			log(res);
		});
	}

	function handleLaunch(event) {
		togglePiccap(event && event.type ? event.type : "launch");
	}

	document.addEventListener("webOSLaunch", handleLaunch, true);
	document.addEventListener("webOSRelaunch", handleLaunch, true);

	if (document.readyState === "loading") {
		document.addEventListener("DOMContentLoaded", function () {
			togglePiccap("load");
		}, true);
	} else {
		togglePiccap("load");
	}
}());


</script>
</body>

</html>
